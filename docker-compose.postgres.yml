# PostgreSQL override —— 疊在 docker-compose.yml 上使用：
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# 需要在 .env 設定 POSTGRES_PASSWORD。附件仍然放在 app 的 sa-rfi-data volume，
# 只有資料庫換到 PostgreSQL。

services:
  app:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sarfi}:${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sa_rfi}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sa_rfi}
      POSTGRES_USER: ${POSTGRES_USER:-sarfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    volumes:
      - sa-rfi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sarfi} -d ${POSTGRES_DB:-sa_rfi}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sa-rfi-db:
