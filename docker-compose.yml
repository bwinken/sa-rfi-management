# 預設組態：單一副本 + SQLite，狀態全部放在具名 volume。
#
#   cp .env.example .env     # 填 CLIENT_SECRET 等；內網再加 proxy 設定
#   docker compose up -d
#
# 之後要改用 PostgreSQL，疊上 override 檔即可（不必改這一份）：
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
# 搬移既有 SQLite 資料的做法見 README「從 SQLite 換到 PostgreSQL」。

services:
  app:
    build:
      context: .
      # 內網環境把這些放進同目錄的 .env，docker compose build 就會帶進去。
      # 公司自簽 CA 請把 .crt 放到 certs/（不必在這裡設定）。
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: sa-rfi-management:latest
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      # ── 對外位址 ──
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8003}

      # ── Auth Center SSO ──
      AUTH_CENTER_BASE_URL: ${AUTH_CENTER_BASE_URL:-http://localhost:8000}
      APP_ID: ${APP_ID:-sa_rfi_management}
      # 正式使用時請在 .env 設定；只是先跑起來看畫面（DEV_AUTH_BYPASS=true）可留空
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 留空 = 自動組出 {APP_BASE_URL}/auth/callback，須與 Auth Center 註冊值一致
      REDIRECT_URI: ${REDIRECT_URI:-}
      # 留空 = 自動用 {AUTH_CENTER_BASE_URL}/.well-known/jwks.json；填 off 停用
      JWKS_URL: ${JWKS_URL:-}
      # 離線後備公鑰：把 Auth Center 的 public.pem 放進 volume 的 keys/ 底下即可
      PUBLIC_KEY_PATH: ${PUBLIC_KEY_PATH:-/data/keys/public.pem}

      # ── 狀態：容器內一律寫在 /data，對應下方的 volume ──
      DATA_DIR: /data
      # 留空 = 用 /data/sa_rfi.db（SQLite）。要走 Postgres 就設定這個：
      DATABASE_URL: ${DATABASE_URL:-}

      # 日誌走 stdout，用 docker compose logs 看
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 反向代理子路徑（部署在 http://host/sa-rfi/ 之類時才需要）
      ROOT_PATH: ${ROOT_PATH:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      DECK_TITLE: ${DECK_TITLE:-Customer RFI Collection}
      DESIGNED_BY: ${DESIGNED_BY:-}
      EXECUTED_BY: ${EXECUTED_BY:-}

      # ⚠️ 僅供 Auth Center 還沒接好時先把畫面跑起來看；正式環境務必維持 false
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      DEV_USER: ${DEV_USER:-dev.user}
      DEV_SCOPES: ${DEV_SCOPES:-read,write,admin}
      # 多副本時設成 image tag / commit sha，讓各副本的靜態資源版本一致
      ASSET_VERSION: ${ASSET_VERSION:-}
    volumes:
      - sa-rfi-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/readyz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3


volumes:
  # SQLite 檔與附件；改用 Postgres 時這個 volume 只剩附件
  sa-rfi-data:
